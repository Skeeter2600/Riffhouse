name: riffhouse
description: "A cross-platform Jellyfin music player with offline support and Android Auto."
publish_to: 'none'

version: 1.1.1+10101

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Audio playback engine
  just_audio: 0.10.6

  # Background audio service (Android Auto / CarPlay / lock screen)
  audio_service: ^0.18.16

  # State management
  flutter_riverpod: ^2.5.1

  # Local database (drift - actively maintained SQLite ORM)
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  crypto: ^3.0.3

  # Networking
  dio: ^5.4.3+1
  http: ^1.2.1

  # Storage
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^14.2.7

  # UI utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  rxdart: ^0.28.0

  # Google Fonts
  google_fonts: ^6.2.1
  image_picker: ^1.2.3

  audio_session: ^0.1.25
  flutter_cache_manager: ^3.4.1
  url_launcher: ^6.3.2
  package_info_plus: ">=8.0.0 <10.0.0"
  connectivity_plus: ^7.3.2
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.2
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0A0A0F"
    theme_color: "#0A0A0F"
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

