name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Android APK Build
  # --------------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Build Android APK
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk Riffhouse-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Riffhouse-Android.apk

  # --------------------------------------------------------------------------
  # 2. Windows Build
  # --------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: '3.44.4'
          cache: true
      - name: Build Windows Desktop
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build windows --release
      - name: Archive Windows Release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Riffhouse-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Riffhouse-Windows-x64.zip

  # --------------------------------------------------------------------------
  # 3. Linux Build
  # --------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: '3.44.4'
          cache: true
      - name: Build Linux Desktop
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build linux --release
      - name: Archive Linux Release
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ${{ github.workspace }}/Riffhouse-Linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: Riffhouse-Linux-x64.tar.gz

  # --------------------------------------------------------------------------
  # 4. macOS & iOS Build (macOS runner)
  # --------------------------------------------------------------------------
  build-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: '3.44.4'
          cache: true

      - name: Setup & Codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # Build macOS Desktop App
      - name: Build macOS
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r ${{ github.workspace }}/Riffhouse-macOS.zip Riffhouse.app

      # Build Unsigned iOS IPA for Sideloading
      - name: Build iOS IPA
        run: |
          flutter build ipa --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r ${{ github.workspace }}/Riffhouse.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: apple-releases
          path: |
            Riffhouse-macOS.zip
            Riffhouse.ipa

  # --------------------------------------------------------------------------
  # 5. Publish All to GitHub Releases
  # --------------------------------------------------------------------------
  publish-release:
    needs: [build-android, build-windows, build-linux, build-apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/Riffhouse-Android.apk
            release-artifacts/Riffhouse-Windows-x64.zip
            release-artifacts/Riffhouse-Linux-x64.tar.gz
            release-artifacts/Riffhouse-macOS.zip
            release-artifacts/Riffhouse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
