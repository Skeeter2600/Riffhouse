name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Android APK Build
  # --------------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Derive version from tag
        shell: bash
        run: |
          # A tag like v1.2.3 becomes version 1.2.3 with build number 10203,
          # so the tag is the single source of truth and the Android
          # versionCode always increases. Manual runs keep the pubspec version.
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            NUMBER=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            echo "VERSION_ARGS=--build-name=$NAME --build-number=$NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Every release must carry the same signature, otherwise Android
          # rejects the update with "App not installed".
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/riffhouse-release.jks
          {
            echo "storeFile=riffhouse-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=riffhouse"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > android/key.properties
      - name: Build Android APK
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release $VERSION_ARGS
          cp build/app/outputs/flutter-apk/app-release.apk Riffhouse-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Riffhouse-Android.apk

  # --------------------------------------------------------------------------
  # 2. Windows Build
  # --------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.4'
          cache: true
      - name: Derive version from tag
        shell: bash
        run: |
          # A tag like v1.2.3 becomes version 1.2.3 with build number 10203,
          # so the tag is the single source of truth and the Android
          # versionCode always increases. Manual runs keep the pubspec version.
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            NUMBER=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            echo "VERSION_ARGS=--build-name=$NAME --build-number=$NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Build Windows Desktop
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build windows --release $VERSION_ARGS
      - name: Archive Windows Release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Riffhouse-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Riffhouse-Windows-x64.zip

  # --------------------------------------------------------------------------
  # 3. Linux Build
  # --------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.4'
          cache: true
      - name: Derive version from tag
        shell: bash
        run: |
          # A tag like v1.2.3 becomes version 1.2.3 with build number 10203,
          # so the tag is the single source of truth and the Android
          # versionCode always increases. Manual runs keep the pubspec version.
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            NUMBER=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            echo "VERSION_ARGS=--build-name=$NAME --build-number=$NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Build Linux Desktop
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build linux --release $VERSION_ARGS
      - name: Archive Linux Release
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ${{ github.workspace }}/Riffhouse-Linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: Riffhouse-Linux-x64.tar.gz

  # --------------------------------------------------------------------------
  # 4. macOS & iOS Build (macOS runner)
  # --------------------------------------------------------------------------
  build-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.4'
          cache: true

      - name: Derive version from tag
        shell: bash
        run: |
          # A tag like v1.2.3 becomes version 1.2.3 with build number 10203,
          # so the tag is the single source of truth and the Android
          # versionCode always increases. Manual runs keep the pubspec version.
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            NUMBER=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            echo "VERSION_ARGS=--build-name=$NAME --build-number=$NUMBER" >> "$GITHUB_ENV"
          fi
      - name: Setup & Codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # Build macOS Desktop App
      - name: Build macOS
        run: |
          flutter build macos --release $VERSION_ARGS
          cd build/macos/Build/Products/Release
          zip -r ${{ github.workspace }}/Riffhouse-macOS.zip *.app

      # Build Unsigned iOS IPA for Sideloading
      - name: Build iOS IPA
        run: |
          flutter build ipa --release --no-codesign $VERSION_ARGS
          mkdir -p Payload
          # Copy whatever .app was built in the iOS archive into Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app Payload/
          zip -r ${{ github.workspace }}/Riffhouse.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: apple-releases
          path: |
            Riffhouse-macOS.zip
            Riffhouse.ipa

  # --------------------------------------------------------------------------
  # 5. Publish All to GitHub Releases
  # --------------------------------------------------------------------------
  publish-release:
    # A manual run only builds; releases come from version tags.
    if: github.ref_type == 'tag'
    needs: [build-android, build-windows, build-linux, build-apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/Riffhouse-Android.apk
            release-artifacts/Riffhouse-Windows-x64.zip
            release-artifacts/Riffhouse-Linux-x64.tar.gz
            release-artifacts/Riffhouse-macOS.zip
            release-artifacts/Riffhouse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
